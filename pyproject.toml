[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seqcredit-model"
version = "0.1.0"
description = "Sequential credit-risk modelling and benchmarking"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "tensorflow",
    "matplotlib",
    "seaborn",
    "joblib",
    "shap",
    "numba>=0.65.1",
    "pyspark",
    "python-pptx",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
