[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seqcredit"
version = "0.1.0"
description = "Sequential credit-risk modelling and benchmarking"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn==1.8.0",
    "lightgbm",
    "tensorflow",
    "joblib",
]

[project.optional-dependencies]
reporting = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
